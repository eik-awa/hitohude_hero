<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ひとふで勇者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#0d1c1a;color:#f2e6c8;font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;display:flex;justify-content:center;align-items:center;transition:background .5s;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;padding-top:6px;max-width:100vw}
#hud{padding:0 2px 6px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.row{display:flex;align-items:center;gap:8px}
#floorName{font-size:15px;flex:1;white-space:nowrap}
#quota{background:#f2e6c8;color:#12121a;padding:1px 8px;border-radius:4px;font-size:13px;white-space:nowrap}
#mute{background:none;border:1px solid #f2e6c855;color:#f2e6c8aa;font:inherit;font-size:11px;padding:2px 6px;border-radius:4px}
#depth{display:flex;align-items:center;gap:0;height:12px;font-size:12px;color:#f2e6c8aa}
#depth i{flex:1;height:4px;background:#f2e6c822;margin-right:3px;border-radius:2px;position:relative}
#depth i.done{background:#f2e6c8aa}
#depth i.cur{background:#ffe27a;animation:blink 1s infinite}
#depth i.boss::after{content:'';position:absolute;right:-1px;top:-3px;width:10px;height:10px;background:#ff6b5a;transform:rotate(45deg);border-radius:2px}
#depth i.boss.done::after{background:#f2e6c8aa}
@keyframes blink{50%{opacity:.45}}
.bar{position:relative;flex:1;height:20px;background:#00000066;border-radius:5px;overflow:hidden;border:1px solid #f2e6c833}
.bar i{position:absolute;inset:0 auto 0 0;background:#58d07a;transition:width .18s}
.bar i.low{background:#ff5a5a;animation:blink .5s infinite}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:normal;color:#fff;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
.bar.exp{height:14px}.bar.exp i{background:#ffcf4a}.bar.exp b{font-size:10px}
#guard{min-width:52px;text-align:center;border:1px solid #5cc3ea55;color:#5cc3ea88;border-radius:5px;padding:1px 4px;font-size:13px}
#guard.on{background:#5cc3ea;color:#08202c;border-color:#5cc3ea}
#lv{min-width:36px;color:#ffe27a}
#atk{white-space:nowrap}#gold{color:#ffcf4a;min-width:44px;text-align:right;white-space:nowrap}
#play{position:relative}
#stage{position:relative;line-height:0;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px #f2e6c822}
canvas{display:block;touch-action:none}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;opacity:0;line-height:1.3}
#banner b{display:block;font-size:26px;font-weight:normal;color:#fff;text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000}
#banner span{display:inline-block;margin-top:4px;font-size:14px;background:#12121acc;padding:2px 10px;border-radius:4px;color:#ffe27a}
#banner.show{animation:ban 1.5s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.5)}12%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#info{height:50px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;padding:0 4px;text-align:center;line-height:1.25}
#info .hint{color:#f2e6c8bb;font-size:12.5px}
#info b{font-weight:normal;white-space:nowrap}
#info .pw{background:#ffe27a;color:#12121a;padding:1px 8px;border-radius:4px}
#info .pw.big{font-size:20px;padding:2px 14px}
#info .kl{color:#ffb347}#info .hl{color:#7dffa0}#info .gd{color:#ffcf4a}
#info .ok{color:#7dffa0}#info .bad{color:#ff6b6b}
#modal{position:absolute;inset:0;background:#07070dd9;overflow-y:auto;display:flex;border-radius:10px;z-index:5}
#modal[hidden]{display:none}
.box{margin:auto;width:100%;padding:14px 12px;text-align:center;display:flex;flex-direction:column;gap:9px}
h1{font-size:34px;font-weight:normal;color:#ffe27a;letter-spacing:2px;text-shadow:0 3px 0 #7a4a2a}
h2{font-size:22px;font-weight:normal;color:#ffe27a}h2.bad{color:#ff6b6b}h2.win{font-size:26px}
.lead{font-size:13.5px;line-height:1.6;color:#f2e6c8}.rec{font-size:12px;color:#f2e6c899}
button{font-family:inherit;cursor:pointer}
.box>button{background:#262638;color:#f2e6c8;border:1px solid #f2e6c844;border-radius:8px;padding:10px;font-size:15px}
.box>button.main{background:#ffe27a;color:#12121a;border-color:#ffe27a;font-size:18px;padding:13px}
.box>button small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.shop{display:flex;gap:8px}
.shop button{flex:1;background:#1c1c2a;border:1px solid #ffcf4a66;border-radius:8px;color:#f2e6c8;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.shop button b{font-weight:normal;font-size:15px}.shop button small{font-size:11px;opacity:.75}.shop button i{font-style:normal;color:#ffcf4a;font-size:13px}
.shop button:disabled{opacity:.35}
.cards{display:flex;flex-direction:column;gap:7px}
.cards button{display:flex;align-items:center;gap:10px;text-align:left;background:#f2e6c8;color:#12121a;border:none;border-radius:8px;padding:8px 10px;box-shadow:0 3px 0 #a89a78}
.cards button:active{transform:translateY(2px);box-shadow:0 1px 0 #a89a78}
.cards em{font-style:normal;flex:none;width:38px;height:38px;border-radius:50%;background:#12121a;color:#ffe27a;display:flex;align-items:center;justify-content:center;font-size:20px}
.cards b{display:block;font-weight:normal;font-size:15px}.cards small{font-size:12px;color:#12121aaa}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="row"><div id="floorName"></div><div id="quota"></div><button id="mute">音あり</button></div>
    <div id="depth"></div>
    <div class="row"><div class="bar"><i id="hpFill"></i><b id="hpTxt"></b></div><div id="guard">盾 0</div></div>
    <div class="row"><div id="lv">Lv1</div><div class="bar exp"><i id="expFill"></i><b id="expTxt"></b></div><div id="atk"></div><div id="gold"></div></div>
  </div>
  <div id="play">
    <div id="stage"><canvas id="cv"></canvas><div id="banner"></div></div>
    <div id="info"></div>
    <div id="modal" hidden></div>
  </div>
</div>
<script>
// ===== ひとふで勇者: ルール部分（画面に依存しない） =====
const GW = 6, GH = 6, GUARD_MAX = 12, LAST_FLOOR = 9;

const P = { // 調整したい数値はここに集める
  heroHp: 20, heroAtk: 2, lvHp: 4, lvAtk: 1,
  wSword: 38, wHeart: 12, wCoin: 14, wShield: 10, wSwordLuck: 8,
  enemyRate: 0.2, enemyRateF: 0.012,
  comboExp: 0.5, potionCost: 5, smithCost: 8, smithStep: 4,
  retryHeal: 0.6,
};

const CARDS = [
  { id: 'atk', ch: '力', name: '力の指輪', desc: 'こうげき力 +2', max: 99, apply: h => { h.atk += 2; } },
  { id: 'sharp', ch: '研', name: '研ぎ石', desc: '剣タイル1枚の力 +1', max: 3, apply: h => { h.swordPow++; } },
  { id: 'life', ch: '命', name: '命の器', desc: '最大HP +8、さらに全回復', max: 99, apply: h => { h.maxhp += 8; h.hp = h.maxhp; } },
  { id: 'heal', ch: '癒', name: '癒しの心得', desc: 'ハートの回復量 +2', max: 3, apply: h => { h.heartPow += 2; } },
  { id: 'wall', ch: '壁', name: '鉄壁', desc: '盾タイルのガード +1', max: 2, apply: h => { h.shieldPow++; } },
  { id: 'chain', ch: '連', name: '連撃の極意', desc: '敵を倒すたび、力が 2 もどる', max: 3, apply: h => { h.refund += 2; } },
  { id: 'vamp', ch: '吸', name: '吸魂', desc: '敵を倒すたび HP +2', max: 3, apply: h => { h.vamp += 2; } },
  { id: 'zan', ch: '残', name: '残心', desc: 'あまった力の半分がガードになる', max: 1, apply: h => { h.zanshin = 1; } },
  { id: 'luck', ch: '運', name: '剣の導き', desc: '剣タイルが出やすくなる', max: 2, apply: h => { h.swordLuck++; } },
  { id: 'gold', ch: '商', name: '商才', desc: 'コイン1枚の価値 +1', max: 2, apply: h => { h.coinPow++; } },
];

function isBossFloor(f) { return f % 3 === 0; }
function quotaFor(f) { return Math.min(3 + f, 9); }
function expNext(lv) { return Math.floor(6 * Math.pow(1.42, lv - 1)) + (lv - 1) * 2; }
function themeOf(f) { return f > LAST_FLOOR ? 3 : Math.floor((f - 1) / 3); }

function newHero() {
  return { x: 2, y: 4, hp: P.heroHp, maxhp: P.heroHp, atk: P.heroAtk, lv: 1, exp: 0, next: expNext(1), gold: 0, guard: 0,
    swordPow: 1, heartPow: 3, coinPow: 1, shieldPow: 1, refund: 0, vamp: 0, zanshin: 0, swordLuck: 0, smith: 0, cards: {} };
}

function newGame() {
  const S = { hero: newHero(), floor: 0, grid: [], kills: 0, quota: 0, stairs: false, bossDead: false, overtime: 0, turn: 0,
    phase: 'play', endless: false, offers: [], tut: null, stats: { kills: 0, bestCombo: 0, turns: 0 }, checkpoint: null };
  startFloor(S, 1);
  return S;
}

function eachCell(fn) { for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) fn(x, y); }
function countEnemies(S) { let n = 0; eachCell((x, y) => { const t = S.grid[y][x]; if (t && t.k === 'enemy') n++; }); return n; }

function makeEnemy(S, type) {
  const f = S.floor, b = Math.floor(S.overtime / 4);
  if (!type) {
    const w = [['slime', f <= 6 ? 5 : 1.5], ['bat', f >= 2 ? 4 : 0], ['skel', f >= 4 ? 5 : 0], ['bomb', f >= 5 ? 2.2 : 0], ['golem', f >= 7 ? 3 : 0]];
    let tot = 0; for (const a of w) tot += a[1];
    let r = Math.random() * tot; type = 'slime';
    for (const a of w) { if (r < a[1]) { type = a[0]; break; } r -= a[1]; }
  }
  let e;
  if (type === 'slime') e = { name: 'スライム', hp: 2 + Math.floor(f * 1.3), atk: 1 + Math.floor(f / 2), cdMax: 3, exp: 2 + Math.floor(f / 3) };
  else if (type === 'bat') e = { name: 'コウモリ', hp: 1 + f, atk: 1 + Math.floor(f / 3), cdMax: 2, exp: 2 + Math.floor(f / 3) };
  else if (type === 'skel') e = { name: 'ガイコツ', hp: 4 + f * 2, atk: 2 + Math.floor(f * 0.7), cdMax: 3, exp: 3 + Math.floor(f / 2) };
  else if (type === 'bomb') e = { name: 'バクダン', hp: 2 + f, atk: 6 + f, boom: 6 + f, cdMax: 4, exp: 3 + Math.floor(f / 2) };
  else e = { name: 'ゴーレム', hp: 10 + f * 3, atk: 4 + f, cdMax: 4, exp: 6 + f };
  e.hp += b; if (type !== 'bomb') e.atk += Math.floor(b / 2);
  e.k = 'enemy'; e.type = type; e.maxhp = e.hp; e.cd = e.cdMax;
  return e;
}

function makeBoss(S) {
  const i = (S.floor / 3 - 1) % 3, m = Math.pow(1.8, Math.floor((S.floor - 1) / 9));
  const B = [
    { type: 'king', name: 'キングスライム', hp: 30, atk: 4, exp: 14 },
    { type: 'general', name: 'ガイコツ将軍', hp: 62, atk: 7, exp: 28, armor: 5 },
    { type: 'dragon', name: '魔竜', hp: 115, atk: 11, exp: 60 },
  ][i];
  const e = Object.assign({ k: 'enemy', boss: true, cdMax: 3 }, B);
  e.hp = Math.round(e.hp * m); e.atk = Math.round(e.atk * m); e.exp = Math.round(e.exp * m);
  if (e.armor) e.armor = Math.round(e.armor * m);
  e.maxhp = e.hp; e.cd = e.cdMax;
  return e;
}

function genTile(S) {
  const f = S.floor, h = S.hero, n = countEnemies(S), boss = isBossFloor(f);
  const minE = boss ? 1 : 2, maxE = boss ? 4 : Math.min(3 + Math.floor(f / 2), 7);
  let pE = P.enemyRate + Math.min(f, 12) * P.enemyRateF;
  if (n < minE) pE = 1; if (n >= maxE) pE = 0;
  if (Math.random() < pE) return makeEnemy(S);
  const w = [['sword', P.wSword + P.wSwordLuck * h.swordLuck], ['heart', P.wHeart], ['coin', P.wCoin], ['shield', P.wShield]];
  let tot = 0; for (const a of w) tot += a[1];
  let r = Math.random() * tot;
  for (const a of w) { if (r < a[1]) return { k: a[0] }; r -= a[1]; }
  return { k: 'sword' };
}

function startFloor(S, f) {
  const h = S.hero;
  S.floor = f; S.kills = 0; S.quota = quotaFor(f); S.stairs = false; S.bossDead = false; S.overtime = 0; S.phase = 'play'; S.tut = null;
  S.grid = []; for (let y = 0; y < GH; y++) S.grid.push(new Array(GW).fill(null));
  const order = []; eachCell((x, y) => { if (!(x === h.x && y === h.y)) order.push([x, y]); });
  let bossCell = null;
  if (isBossFloor(f)) { // ボスは勇者から一番遠い所に
    order.sort((a, b) => dist(b, h) - dist(a, h)); bossCell = order[0];
    S.grid[bossCell[1]][bossCell[0]] = makeBoss(S);
  }
  for (const [x, y] of shuffle(order.slice())) if (!S.grid[y][x]) S.grid[y][x] = genTile(S);
  if (f === 1) { // 導入: 最初の一手を必ず気持ちよく決められる盤面
    h.x = 2; h.y = 4; S.grid[4][2] = null;
    S.grid[3][2] = { k: 'sword' }; S.grid[2][3] = { k: 'sword' }; S.grid[2][4] = { k: 'sword' };
    S.grid[1][4] = makeEnemy(S, 'slime');
    S.tut = [[2, 3], [3, 2], [4, 2], [4, 1]];
    eachCell((x, y) => { if (!S.grid[y][x] && !(x === h.x && y === h.y)) S.grid[y][x] = { k: 'coin' }; });
  }
  S.checkpoint = JSON.stringify({ hero: h, floor: f, endless: S.endless, stats: S.stats });
}

function dist(a, h) { return Math.max(Math.abs(a[0] - h.x), Math.abs(a[1] - h.y)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function neighbors(x, y) {
  const r = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue; const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < GW && ny < GH) r.push([nx, ny]);
  }
  return r;
}

// ---- 先読み（なぞっている最中の予測。盤面は書き換えない）----
function sim(S, path) {
  const h = S.hero;
  const R = { pool: h.atk, heal: 0, gold: 0, guard: h.guard, kills: 0, bump: null, clang: false, stairs: false, ended: false, marks: {}, taken: 0, incoming: 0 };
  const hp = new Map(), dead = new Set();
  const getHp = e => hp.has(e) ? hp.get(e) : e.hp;
  const kill = (e, x, y) => {
    dead.add(e); R.kills++; R.pool += h.refund; R.heal += h.vamp; R.marks[x + ',' + y] = 'kill';
    if (e.type === 'bomb') for (const [nx, ny] of neighbors(x, y)) {
      const t = S.grid[ny][nx];
      if (t && t.k === 'enemy' && !dead.has(t)) { const v = getHp(t) - e.boom; if (v <= 0) kill(t, nx, ny); else { hp.set(t, v); R.marks[nx + ',' + ny] = 'hurt'; } }
    }
  };
  for (const [x, y] of path) {
    const t = S.grid[y][x];
    if (!t || dead.has(t)) continue;
    if (t.k === 'sword') R.pool += h.swordPow;
    else if (t.k === 'heart') R.heal += h.heartPow;
    else if (t.k === 'coin') R.gold += h.coinPow;
    else if (t.k === 'shield') R.guard += h.shieldPow;
    else if (t.k === 'stairs') { R.stairs = true; R.ended = true; break; }
    else if (t.k === 'enemy') {
      const v = getHp(t);
      if (t.armor && R.pool < t.armor) { R.clang = true; R.ended = true; R.bump = { x, y, dmg: 0 }; break; }
      if (R.pool >= v) { R.pool -= v; kill(t, x, y); }
      else { hp.set(t, v - R.pool); R.bump = { x, y, dmg: R.pool }; R.pool = 0; R.ended = true; break; }
    }
  }
  if (h.zanshin && !R.stairs) R.guard += Math.floor(R.pool / 2);
  R.guard = Math.min(GUARD_MAX, R.guard);
  if (!R.stairs) eachCell((x, y) => {
    const t = S.grid[y][x];
    if (t && t.k === 'enemy' && !dead.has(t) && t.cd - 1 <= 0) R.incoming += t.atk;
  });
  R.taken = Math.max(0, R.incoming - R.guard);
  return R;
}

function canAdd(S, path, x, y) {
  const h = S.hero;
  if (x < 0 || y < 0 || x >= GW || y >= GH) return false;
  if (x === h.x && y === h.y) return false;
  const last = path.length ? path[path.length - 1] : [h.x, h.y];
  if (Math.max(Math.abs(last[0] - x), Math.abs(last[1] - y)) !== 1) return false;
  for (const p of path) if (p[0] === x && p[1] === y) return false;
  const t = S.grid[y][x]; if (!t) return false;
  const R = sim(S, path);
  if (R.ended) return false;
  if (t.k === 'enemy') { if (R.pool <= 0) return false; if (t.armor && R.pool < t.armor) return false; }
  return true;
}

// ---- 1ターンの進行。盤面を書き換えながら、演出用の出来事を順に返す ----
function* turn(S, path) {
  const h = S.hero, c = { pool: h.atk, combo: 0, n: 0 };
  let stairs = false;
  S.turn++; S.stats.turns++;
  for (const [x, y] of path) {
    const t = S.grid[y][x];
    if (!t) { h.x = x; h.y = y; yield { t: 'move', x, y }; continue; }
    if (t.k === 'enemy') {
      if (t.armor && c.pool < t.armor) { yield { t: 'clang', x, y }; break; }
      if (c.pool >= t.hp) {
        const d = t.hp; c.pool -= d; t.hp = 0;
        yield { t: 'hit', x, y, e: t, dmg: d, kill: true, pool: c.pool };
        yield* killEnemy(S, x, y, t, c);
        h.x = x; h.y = y; yield { t: 'move', x, y };
      } else {
        const d = c.pool; t.hp -= d; c.pool = 0;
        yield { t: 'hit', x, y, e: t, dmg: d, kill: false, pool: 0 };
        break;
      }
    } else {
      S.grid[y][x] = null; h.x = x; h.y = y; c.n++;
      yield { t: 'move', x, y };
      let val = 0;
      if (t.k === 'sword') { c.pool += h.swordPow; val = h.swordPow; }
      else if (t.k === 'heart') { val = Math.min(h.heartPow, h.maxhp - h.hp); h.hp += val; }
      else if (t.k === 'coin') { h.gold += h.coinPow; val = h.coinPow; }
      else if (t.k === 'shield') { val = Math.min(h.shieldPow, GUARD_MAX - h.guard); h.guard += val; }
      else if (t.k === 'stairs') stairs = true;
      yield { t: 'pick', k: t.k, x, y, n: c.n, val, pool: c.pool };
      if (stairs) break;
    }
  }
  if (c.combo > S.stats.bestCombo) S.stats.bestCombo = c.combo;
  if (stairs) {
    S.phase = (S.floor === LAST_FLOOR && !S.endless) ? 'win' : 'rest';
    S.offers = pickOffers(S);
    yield { t: 'descend' };
    return;
  }
  if (h.zanshin && c.pool > 1) {
    const g = Math.min(Math.floor(c.pool / 2), GUARD_MAX - h.guard);
    if (g > 0) { h.guard += g; yield { t: 'zanshin', val: g }; }
  }
  // 敵の番
  const list = [];
  eachCell((x, y) => { const t = S.grid[y][x]; if (t && t.k === 'enemy') list.push([x, y, t]); });
  for (const a of list) a[2].cd--;
  for (const [x, y, e] of list) {
    if (e.cd > 0) continue;
    e.cd = e.cdMax;
    const bomb = e.type === 'bomb';
    if (bomb) S.grid[y][x] = null;
    const dmg = e.atk, ab = Math.min(h.guard, dmg);
    h.guard -= ab; h.hp -= dmg - ab;
    yield { t: 'attack', x, y, e, dmg: dmg - ab, absorbed: ab, bomb };
    if (h.hp <= 0) { h.hp = 0; S.phase = 'dead'; yield { t: 'dead' }; return; }
    if (e.type === 'king') {
      const cs = []; eachCell((cx, cy) => { const t = S.grid[cy][cx]; if (t && t.k !== 'enemy' && t.k !== 'stairs') cs.push([cx, cy]); });
      if (cs.length && countEnemies(S) < 5) { const [cx, cy] = cs[Math.floor(Math.random() * cs.length)]; S.grid[cy][cx] = makeEnemy(S, 'slime'); yield { t: 'summon', x: cx, y: cy }; }
    } else if (e.type === 'dragon') {
      const cs = []; eachCell((cx, cy) => { const t = S.grid[cy][cx]; if (t && t.k === 'sword') cs.push([cx, cy]); });
      const burn = shuffle(cs).slice(0, 3);
      for (const [cx, cy] of burn) S.grid[cy][cx] = { k: 'ash' };

    }

  const cleared = isBossFloor(S.floor) ? S.bossDead : S.kills >= S.quota;
  if (!S.stairs && cleared) {
    let cs = []; eachCell((x, y) => { if (!S.grid[y][x] && !(x === h.x && y === h.y)) cs.push([x, y]); });
    if (!cs.length) eachCell((x, y) => { const t = S.grid[y][x]; if (t && t.k !== 'enemy') cs.push([x, y]); });

}

function* killEnemy(S, x, y, e, c) {
  const h = S.hero;
  S.grid[y][x] = null; c.combo++; S.kills++; S.stats.kills++;
  if (e.boss) S.bossDead = true;
  c.pool += h.refund;
  const heal = Math.min(h.vamp, h.maxhp - h.hp); h.hp += heal;
  const exp = Math.ceil(e.exp * (1 + P.comboExp * (c.combo - 1)));
  yield { t: 'kill', x, y, e, exp, combo: c.combo, heal, pool: c.pool };
  if (e.type === 'bomb') {
    yield { t: 'boom', x, y };
    for (const [nx, ny] of neighbors(x, y)) {
      const t = S.grid[ny][nx];
      if (t && t.k === 'enemy') {
        const d = Math.min(t.hp, e.boom); t.hp -= d;
        yield { t: 'hit', x: nx, y: ny, e: t, dmg: d, kill: t.hp <= 0, blast: true, pool: c.pool };
        if (t.hp <= 0) yield* killEnemy(S, nx, ny, t, c);
      }
    }
  }
  h.exp += exp;
  while (h.exp >= h.next) {
    h.exp -= h.next; h.lv++; h.next = expNext(h.lv); h.maxhp += P.lvHp; h.atk += P.lvAtk; h.hp = h.maxhp; c.pool += P.lvAtk;
    yield { t: 'levelup', pool: c.pool };
  }
}

function pickOffers(S) {
  const h = S.hero;
  return shuffle(CARDS.filter(c => (h.cards[c.id] || 0) < c.max)).slice(0, 3).map(c => c.id);
}

function buy(S, what) {

  if (what === 'potion') { if (h.gold < P.potionCost || h.hp >= h.maxhp) return false; h.gold -= P.potionCost; h.hp = Math.min(h.maxhp, h.hp + Math.ceil(h.maxhp / 2)); return true; }
  if (what === 'smith') { const c = smithCost(S); if (h.gold < c) return false; h.gold -= c; h.atk++; h.smith++; return true; }
  return false;
}

  else { fx.hint = '青い勇者から、となりのマスへ指をすべらせよう'; infoDirty = true; }
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return; e.preventDefault();
  const c = cellAt(e), h = S.hero, n = path.length; if (!c.near) return;
  const back = n >= 2 ? path[n - 2] : [h.x, h.y];
  if (n && c.x === back[0] && c.y === back[1]) { setPath(path.slice(0, -1)); sfx.tick(Math.max(0, n - 2)); }
  else if (canAdd(S, path, c.x, c.y)) { setPath(path.concat([[c.x, c.y]])); sfx.tick(n); }
});
function endDrag(go) { if (!dragging) return; dragging = false; const p = path; setPath([]); if (go && p.length) playTurn(p); }
cv.addEventListener('pointerup', () => endDrag(true));
cv.addEventListener('pointercancel', () => endDrag(false));

// ---------- 画面 ----------
function best() { try { return +localStorage.getItem('hitofude_best') || 0; } catch (e) { return 0; } }
function saveBest() { try { if (S.floor > best()) localStorage.setItem('hitofude_best', S.floor); } catch (e) { } }
function modal(html) { const m = $('modal'); m.innerHTML = '<div class="box">' + html + '</div>'; m.hidden = false; m.scrollTop = 0; }
function closeModal() { $('modal').hidden = true; }
function enterFloor() {
  const h = S.hero; fx.hv.x = h.x; fx.hv.y = h.y; fx.off.x = fx.off.y = 0; fx.parts.length = 0; fx.floats.length = 0; fx.pool = null;
  let i = 0; eachCell((x, y) => { const t = S.grid[y][x]; if (t) t._born = performance.now() + 120 + (i++) * 9; });
  fx.hint = FLOOR_HINT[S.floor] || 'ここから先は腕だめし。どこまで潜れるか'; infoDirty = true; saveBest();
  fx.fade = 1; tween(fx, 'fade', 0, 300);
  let boss = null; eachCell((x, y) => { const t = S.grid[y][x]; if (t && t.boss) boss = t; });
  banner('地下' + S.floor + '階', boss ? 'ボス：' + boss.name : THEMES[themeOf(S.floor)].name);
}
function showTitle() {
  const b = best();
  modal('<h1>ひとふで勇者</h1><p class="lead">ひと筆でなぞって、剣を集めて、敵を斬る。<br>地下9階の魔竜を倒せ。</p>' + (b ? '<p class="rec">これまでの最深記録：地下' + b + '階</p>' : '') + '<button class="main" data-act="start">はじめる</button>');
}
function statLine() { return '<p class="rec">倒した敵 ' + S.stats.kills + '体　最大 ' + S.stats.bestCombo + '連撃　' + S.stats.turns + 'ターン</p>'; }
function showRest() {
  const h = S.hero, sc = smithCost(S);
  let o = '<h2>地下' + S.floor + '階 突破！</h2><div class="shop"><button data-act="buy:potion"' + (h.gold < P.potionCost || h.hp >= h.maxhp ? ' disabled' : '') + '><b>薬草</b><small>HPを半分回復</small><i>' + P.potionCost + 'G</i></button><button data-act="buy:smith"' + (h.gold < sc ? ' disabled' : '') + '><b>鍛冶</b><small>こうげき力 +1</small><i>' + sc + 'G</i></button></div><p class="lead">祝福をひとつ選ぶと、次の階へ進む</p><div class="cards">';
  for (const id of S.offers) { const c = CARDS.find(c => c.id === id); o += '<button data-act="card:' + id + '"><em>' + c.ch + '</em><span><b>' + c.name + '</b><small>' + c.desc + '</small></span></button>'; }
  modal(o + '</div>');
}
function showDead() {
  modal('<h2 class="bad">力尽きた…</h2><p class="lead">地下' + S.floor + '階</p>' + statLine() + '<button class="main" data-act="retry">この階からやり直す<small>たき火で休んでHPを回復して再開</small></button><button data-act="restart">最初から</button>');
}
function showWin() {
  sfx.win();
  modal('<h2 class="win">魔竜を倒した！</h2><p class="lead">地下9階、踏破。</p>' + statLine() + '<button class="main" data-act="endless">さらに深くへ<small>終わりのない深淵に潜る</small></button><button data-act="restart">最初から</button>');
}
$('modal').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return; ac(); sfx.ui();
  const [a, v] = b.dataset.act.split(':');
  if (a === 'start') { started = true; closeModal(); enterFloor(); }
  else if (a === 'buy') { if (buy(S, v)) { sfx.heal(); showRest(); } }
  else if (a === 'card') { takeCard(S, v); nextFloor(S); closeModal(); enterFloor(); }
  else if (a === 'retry') { retryFloor(S); closeModal(); enterFloor(); }
  else if (a === 'restart') { S = newGame(); closeModal(); enterFloor(); }
  else if (a === 'endless') { S.endless = true; S.phase = 'rest'; showRest(); }
});
$('mute').addEventListener('click', () => { muted = !muted; $('mute').textContent = muted ? '音なし' : '音あり'; ac(); });

function resize() {
  const vw = Math.min(window.innerWidth, 520), vh = window.innerHeight, top = $('hud').offsetHeight, bot = $('info').offsetHeight;
  s = Math.max(36, Math.floor(Math.min((vw - 12) / GW, (vh - top - bot - 14) / GH, 86)));
  dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = GW * s * dpr; cv.height = GH * s * dpr; cv.style.width = GW * s + 'px'; cv.style.height = GH * s + 'px';
  $('app').style.width = GW * s + 'px';
}
window.addEventListener('resize', resize);
S = newGame(); resize(); showTitle(); requestAnimationFrame(frame);
window.__game = { get S() { return S; }, playTurn, get busy() { return busy; } };

</script>
</body>
