<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ひとふで勇者</title>
<style>
@font-face{font-family:'DotGothic16';src:url('DotGothic16-Regular.ttf') format('truetype');font-display:block}
:root{
  --bg:#0d1c1a;--ink:#f2e6c8;--ink2:#f2e6c8b3;--ink3:#f2e6c866;--gold:#ffe27a;--coin:#ffcf4a;
  --hp:#58d07a;--bad:#ff6b6b;--good:#7dffa0;--guard:#5cc3ea;--panel:#14141f;--panel2:#1f1f30;--line:#f2e6c826;
  --edge:#07060a;--win:#15121b;--frame:#3a3446;
  --stone:#2c2735;--stone-hi:#4d4659;--stone-lo:#17141d;
  --amber:#d8a03c;--amber-hi:#f6d27a;--amber-lo:#7a4e16;
  --rune:#3b2a55;--rune-hi:#5f4b8c;--rune-lo:#1d1430;
  --parch:#e6d3a3;--parch-hi:#f7ebc6;--parch-lo:#a8895a;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:'DotGothic16','Hiragino Kaku Gothic ProN',sans-serif;display:flex;justify-content:center;align-items:center;transition:background .5s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:inherit;-webkit-user-select:none;user-select:none}
img{image-rendering:pixelated;-webkit-touch-callout:none;-webkit-user-drag:none;user-drag:none;pointer-events:none} /* 長押しで画像を保存できないように */
img.ic{height:1.1em;width:auto;vertical-align:-.18em;margin:0 .08em}
.intro img.ic,.gi img.ic,.note img.ic,.enemycard img.ic,#tip img.ic,#info .hint img.ic,#info .warn img.ic,#goal img.ic,#banner img.ic{background:#f2e6c8cc;border-radius:2px;padding:1px 2px;box-sizing:content-box}
#app{display:flex;flex-direction:column;padding-top:calc(var(--sat) + 4px);max-width:100vw}
/* ---- HUD ---- */
#hud{padding:0 2px 6px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.row{display:flex;align-items:center;gap:8px}
.icon-btn{flex:none;width:38px;height:34px;margin:2px;border-radius:0;border:none;background:linear-gradient(#35413e 0 7px,#2c3634 7px);box-shadow:inset 0 2px 0 #566a67,inset 0 -3px 0 #151c1b,0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge),0 6px 0 -2px #000a;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn:active{box-shadow:inset 0 2px 0 #151c1b,0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge);transform:translateY(2px)}
#floorName{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#quota{background:var(--parch);color:#2a1c0c;padding:3px 9px;border-radius:3px;border:2px solid var(--edge);box-shadow:inset 1px 1px 0 var(--parch-hi),inset -1px -2px 0 var(--parch-lo);font-size:13px;white-space:nowrap}
#quota.go{background:var(--amber);box-shadow:inset 1px 1px 0 var(--amber-hi),inset -1px -2px 0 var(--amber-lo);animation:blink 1s infinite}
#quota.warn{background:#e0463c;color:#fff;box-shadow:inset 1px 1px 0 #ff8a7a,inset -1px -2px 0 #8a1c14;animation:blink 1s infinite}
#turns{flex:1;display:flex;gap:10px;align-items:baseline;font-size:13px;white-space:nowrap}#turns .par{color:var(--gold);font-size:12px}
.enemies{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.enemies img{width:44px;height:44px;background:var(--win);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--frame);border-radius:3px}
.newbest{color:var(--good);font-size:15px;animation:blink 1s 3}
#depth{display:flex;align-items:center;height:12px;font-size:12px;color:var(--ink2)}
#depth i{flex:1;height:4px;background:#f2e6c822;margin-right:3px;border-radius:2px;position:relative}
#depth i.done{background:#f2e6c8aa}
#depth i.cur{background:var(--gold);animation:blink 1s infinite}
#depth i.boss::after{content:'';position:absolute;right:-1px;top:-3px;width:10px;height:10px;background:#ff6b5a;transform:rotate(45deg);border-radius:2px}
#depth i.boss.done::after{background:#f2e6c8aa}
#depth .ch{flex:none;margin-right:8px;color:var(--gold);font-weight:normal;font-size:12px;white-space:nowrap}
.sec2{font-size:12.5px;color:var(--gold);margin:8px 0 0;letter-spacing:.08em}
#goal{display:flex;align-items:center;gap:8px;background:var(--win);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--frame);border-radius:3px;padding:7px 9px;font-size:13.5px;color:var(--gold);line-height:1.35}
#goal b{font-weight:normal;flex:1}
#goal button{flex:none;background:var(--stone);border:2px solid var(--edge);box-shadow:inset 1px 1px 0 var(--stone-hi),inset -1px -2px 0 var(--stone-lo);border-radius:3px;padding:4px 8px;font-size:12px}
@keyframes blink{50%{opacity:.45}}
.bar{position:relative;flex:1;height:20px;background:#00000080;border-radius:2px;overflow:hidden;border:2px solid var(--edge)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--hp);transition:width .18s}
.bar i.low{background:#ff5a5a;animation:blink .5s infinite}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:normal;color:#fff;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
.bar.exp{height:15px}.bar.exp i{background:var(--coin)}.bar.exp b{font-size:10.5px}
#guard{min-width:56px;display:flex;align-items:center;justify-content:center;gap:3px;border:2px solid var(--edge);background:var(--win);color:#5cc3ea99;border-radius:3px;padding:1px 4px;font-size:13px;height:22px}
#guard.on{background:var(--guard);color:#08202c;border-color:var(--guard)}
#lv{min-width:34px;color:var(--gold)}
#atk,#gold{white-space:nowrap;display:flex;align-items:center;gap:3px}
#gold{color:var(--coin);min-width:46px;justify-content:flex-end}
/* ---- 盤面 ---- */
#play{position:relative}
#stage{position:relative;line-height:0;border-radius:3px;overflow:hidden;box-shadow:0 0 0 2px var(--edge),0 0 0 4px var(--frame)}
canvas{display:block;touch-action:none}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;opacity:0;line-height:1.3}
#banner b{display:block;font-size:26px;font-weight:normal;color:#fff;text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000}
#banner span{display:inline-block;margin-top:4px;font-size:14px;background:#12121acc;padding:2px 10px;border-radius:4px;color:var(--gold)}
#banner.show{animation:ban 1.5s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.5)}12%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#info{min-height:62px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;font-size:14.5px;padding:4px;text-align:center;line-height:1.3}
#info .hint{color:var(--ink2);font-size:13px;flex-basis:100%}
#info b{font-weight:normal;white-space:nowrap}
#info .pw{background:var(--gold);color:#12121a;padding:1px 8px;border-radius:4px}
#info .pw.big{font-size:22px;padding:2px 14px}
#info .mul{display:inline-block;margin-left:6px;padding:0 5px;background:#ff9a3c;color:#fff;border-radius:3px;font-size:.8em;text-shadow:0 1px 0 #0006}
#info .kl{color:#ffb347}#info .hl{color:var(--good)}#info .gd{color:var(--coin)}#info .gu{color:#8fdcff}
#info .ok{color:var(--good)}#info .bad{color:var(--bad)}#info .warn{color:#ffb347;flex-basis:100%;font-size:13px}
#info .sub{color:var(--ink3);font-size:11.5px;flex-basis:100%}
/* ---- 長押し・タップの説明(盤面をグレーアウトして中央にポップアップ) ---- */
#tip{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 18px calc(var(--sab) + 16px);background:#05050a66}
#tip[hidden]{display:none}
#tip .card{position:relative;width:100%;max-width:380px;background:var(--win);box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px var(--frame),0 14px 30px #000c;border-radius:3px;padding:14px 48px 16px 14px;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.65;animation:pop .16s ease-out}
#tip .card>img{width:64px;height:64px;flex:none;background:#00000040;border:2px solid var(--frame);border-radius:2px}
#tip h4{font-weight:normal;font-size:17px;color:var(--gold);margin-bottom:2px}
#tip .st{color:var(--ink2);font-size:12.5px;margin-bottom:4px}
/* 戦闘画面の上にパネルを出すあいだ、盤面をグレーアウト */
#app{transition:filter .18s}
body.dim #app{filter:grayscale(.85) brightness(.5)}
/* ×ボタン(パネルの右上) */
.xbtn{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:32px;margin:0;border:none;border-radius:0;background:linear-gradient(#35413e 0 7px,#2c3634 7px);box-shadow:inset 0 2px 0 #566a67,inset 0 -3px 0 #151c1b,0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.xbtn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #151c1b,0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge)}
/* なぞっている間だけ出る「やめる」(ここへ指を合わせてはなすとキャンセル) */
#cancelZone{height:52px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;opacity:0;transition:opacity .12s;pointer-events:none}
#cancelZone.on{opacity:1}
#cancelZone .cz{display:flex;align-items:center;gap:6px;padding:7px 18px;background:var(--win);color:var(--ink2);font-size:14px;box-shadow:inset 0 0 0 2px var(--frame),0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge);transition:transform .1s}
#cancelZone .cz b{font-weight:normal;font-size:16px}
#cancelZone.hot .cz{background:#c8352a;color:#fff;box-shadow:inset 0 0 0 2px #ff8a7a,0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge);transform:scale(1.15)}
/* ---- 全画面のパネル ---- */
#overlay{position:fixed;inset:0;z-index:10;background:#05050a66;overflow:hidden;display:flex;padding:calc(var(--sat) + 12px) 14px calc(var(--sab) + 14px)}
#overlay[hidden]{display:none}
#overlay.solid{background:radial-gradient(ellipse at 50% 30%,#1b3a33 0%,#0d1c1a 55%,#07100e 100%)}
/* パネル: 見出し(.ov-head)とボタン(.ov-foot)は固定、まん中(.ov-body)だけスクロール */
.box{position:relative;margin:auto;width:100%;max-width:420px;max-height:100%;text-align:center;display:flex;flex-direction:column;gap:10px;animation:pop .18s ease-out}
#overlay:not(.solid) .box{max-width:400px;background:var(--win);box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px var(--frame),0 14px 30px #000c;border-radius:3px;padding:16px 12px 10px}
.ov-head,.ov-foot{flex:none;display:flex;flex-direction:column;gap:10px}
.ov-body{flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.ov-foot{padding-top:2px}
.box.hasx h2{padding:0 40px}
/* タイトル: 背景で一筆書きのデモが動く。上にロゴ、下にボタン、まん中は盤面が見えるように薄く */
#overlay.solid.demo{background:linear-gradient(180deg,#07100ef2 0%,#07100ecc 18%,#07100e59 34%,#07100e4d 58%,#07100ed9 72%,#07100ef5 100%)}
body.titlemode #hud,body.titlemode #info,body.titlemode #cancelZone{visibility:hidden}
.box.title{height:100%}
.box.title .ov-body{flex:1 1 auto;justify-content:space-between}
.t-top{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.t-bot{display:flex;flex-direction:column;gap:10px}
h1.logo{font-size:46px;letter-spacing:4px;color:var(--gold);text-shadow:0 3px 0 #7a4a2a,0 -2px 0 #fff3b0,0 0 22px #ffcf4a66;animation:logoGlow 3.2s ease-in-out infinite}
@keyframes logoGlow{50%{text-shadow:0 3px 0 #7a4a2a,0 -2px 0 #fff3b0,0 0 34px #ffcf4aaa}}
.t-sub{font-size:13px;color:var(--ink2);letter-spacing:.12em;text-shadow:0 1px 0 #000}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
h1{font-size:40px;font-weight:normal;color:var(--gold);letter-spacing:3px;text-shadow:0 3px 0 #7a4a2a}
h2{font-size:23px;font-weight:normal;color:var(--gold)}h2.bad{color:var(--bad)}h2.win{font-size:27px}
h3{font-size:14px;font-weight:normal;color:var(--ink2);letter-spacing:.15em;text-align:left;margin-top:6px;display:flex;align-items:baseline;gap:8px}
h3 small{font-size:11.5px;letter-spacing:0;color:var(--ink3)}
.lead{font-size:14px;line-height:1.75;color:var(--ink)}.lead b,.intro b,.note b{font-weight:normal;color:var(--gold)}
.rec{font-size:12.5px;color:var(--ink2)}
.note{font-size:12.5px;line-height:1.7;color:var(--ink2)}
.err{font-size:12.5px;line-height:1.7;color:var(--bad)}
/* ---- ボタン: ドット絵風。角を1段欠いた輪郭・上下2段の塗り・押すと沈む段差の影 ---- */
.btn{--f:#2c3634;--f2:#35413e;--hi:#566a67;--lo:#151c1b;--ol:var(--edge);--drop:#000000b3;
  position:relative;display:block;width:calc(100% - 6px);margin:3px 3px 7px;border:none;border-radius:0;
  background:linear-gradient(var(--f2) 0 9px,var(--f) 9px);color:var(--ink);padding:12px 14px;font-size:16px;text-align:center;text-shadow:0 2px 0 #0009;
  box-shadow:inset 0 3px 0 var(--hi),inset 0 -4px 0 var(--lo),0 -3px 0 var(--ol),0 3px 0 var(--ol),-3px 0 0 var(--ol),3px 0 0 var(--ol),0 9px 0 -3px var(--drop)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 var(--lo),inset 0 -2px 0 var(--hi),0 -3px 0 var(--ol),0 3px 0 var(--ol),-3px 0 0 var(--ol),3px 0 0 var(--ol),0 6px 0 -3px var(--drop)}
.btn.main{--f:#d4962f;--f2:#e6ad48;--hi:#ffe49a;--lo:#8a5416;--ol:#1a0f04;color:#241505;font-size:19px;padding:14px 30px 15px;text-shadow:0 1px 0 #fff2c066}
.btn.main::before{content:'';position:absolute;left:14px;top:50%;width:8px;height:12px;margin-top:-6px;background:#3a2108;clip-path:polygon(0 0,100% 50%,0 100%);animation:hhcur .9s steps(1) infinite}
@keyframes hhcur{0%{transform:translateX(0)}50%{transform:translateX(3px)}}
.btn.main small{color:#3a2408;opacity:.85}
.btn.ad{--f:#3a2a56;--f2:#46346a;--hi:#6f5aa6;--lo:#1c1330;--ol:#c9a14a;color:#efe4ff}
.btn.ghost{background:none;color:var(--ink2);text-shadow:none;box-shadow:0 -2px 0 #f2e6c81f,0 2px 0 #f2e6c81f,-2px 0 0 #f2e6c81f,2px 0 0 #f2e6c81f}
.btn.ghost:active{transform:translateY(1px);box-shadow:0 -2px 0 #f2e6c833,0 2px 0 #f2e6c833,-2px 0 0 #f2e6c833,2px 0 0 #f2e6c833}
.btn small{display:block;font-size:11.5px;opacity:.75;margin-top:3px}
.btn:disabled{opacity:.42;filter:grayscale(.5);transform:none}
.btn:disabled::before{display:none}
.btns2{display:flex;gap:12px;margin:0 3px}.btns2 .btn{flex:1;width:auto;margin:3px 0 7px;font-size:14px;padding:10px 6px}
.badge{display:inline-block;background:#ff6b5a;color:#fff;font-size:11px;padding:1px 6px;border-radius:9px;margin-left:6px;vertical-align:2px}
.shop{display:flex;gap:10px;margin:0 2px}
.shop button{flex:1;background:linear-gradient(#1f1c29 0 7px,var(--win) 7px);border:none;border-radius:0;margin:2px 0 5px;box-shadow:inset 0 2px 0 #3a3446,inset 0 -3px 0 #0b0a10,0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge),0 6px 0 -2px #000a;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.shop button:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #0b0a10,0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge),0 4px 0 -2px #000a}
.shop button b{font-weight:normal;font-size:16px}.shop button small{font-size:11.5px;opacity:.75}.shop button i{font-style:normal;color:var(--coin);font-size:14px}
.shop button:disabled{opacity:.35}
.cards{display:flex;flex-direction:column;gap:12px;margin:0 3px}
.cards button{display:flex;align-items:center;gap:11px;text-align:left;background:linear-gradient(#f1e2b8 0 8px,var(--parch) 8px);color:#2a1c0c;border:none;border-radius:0;padding:9px 11px;box-shadow:inset 0 3px 0 var(--parch-hi),inset 0 -4px 0 var(--parch-lo),0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge),0 9px 0 -3px #000b}
.cards button:active{transform:translateY(3px);box-shadow:inset 0 3px 0 var(--parch-lo),inset 0 -2px 0 var(--parch-hi),0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge),0 6px 0 -3px #000b}
.cards em{font-style:normal;flex:none;width:40px;height:40px;border-radius:0;background:#2a1c0c;border:2px solid #5a4526;box-shadow:inset 1px 1px 0 #6b5434;color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:21px}
.cards b{display:block;font-weight:normal;font-size:16px}.cards small{font-size:12.5px;color:#2a1c0cbb}
.cards .lv{font-size:11px;color:#12121a88;margin-left:4px}
.statline{display:flex;justify-content:center;gap:12px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.statline span{display:flex;align-items:center;gap:3px}
/* レッスン一覧 */
.lessons{display:flex;flex-direction:column;gap:8px}
.lessons button{display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(#1f1c29 0 7px,var(--win) 7px);border:none;border-radius:0;margin:0 2px;padding:10px 12px;box-shadow:inset 0 2px 0 #3a3446,inset 0 -3px 0 #0b0a10,0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge)}
.lessons button:active{transform:translateY(1px)}
.lessons button.next{box-shadow:inset 0 0 0 2px var(--amber),0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge)}
.lessons .no{flex:none;width:34px;height:34px;border-radius:3px;background:var(--stone);border:2px solid var(--edge);box-shadow:inset 1px 1px 0 var(--stone-hi);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold)}
.lessons .done .no{background:#3f8a4e;box-shadow:inset 1px 1px 0 #6fc47e;color:#0b2414}
.lessons b{display:block;font-weight:normal;font-size:16px}.lessons small{font-size:12px;color:var(--ink2)}
.intro{text-align:left;background:var(--win);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--frame);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;font-size:14px;line-height:1.7}
.intro p{display:flex;gap:8px}.intro p::before{content:'▸';color:var(--gold);flex:none}
.enemycard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--win);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--frame);border-radius:3px;padding:12px}
.enemycard img{width:64px;height:64px;flex:none;background:#00000040;border:2px solid var(--frame);border-radius:2px}
.enemycard b{font-weight:normal;font-size:17px;color:var(--gold)}
.enemycard p{font-size:13px;line-height:1.65;color:var(--ink)}
/* 遊び方 */
.tabs{display:flex;gap:4px;background:var(--win);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--frame);border-radius:3px;padding:5px}
.tabs button{flex:1;border:2px solid transparent;background:none;border-radius:2px;padding:6px 2px;font-size:13.5px;color:var(--ink2)}
.tabs button.on{background:var(--amber);color:#1a0f04;border-color:var(--edge);box-shadow:inset 1px 1px 0 var(--amber-hi),inset -1px -2px 0 var(--amber-lo)}
.guide{text-align:left;display:flex;flex-direction:column;gap:8px;min-height:300px}
.gi{display:flex;gap:10px;align-items:flex-start;background:var(--win);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--frame);border-radius:3px;padding:9px 11px;font-size:13.5px;line-height:1.65}
.gi>img{width:38px;height:38px;flex:none;background:#00000040;border:2px solid var(--frame);border-radius:2px}
.gi b{font-weight:normal;color:var(--gold)}
/* 設定 */
.set{text-align:left;display:flex;flex-direction:column}
.set .sec{font-size:12px;letter-spacing:.3em;color:var(--ink3);margin:16px 0 6px}
.set .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f2e6c814;font-size:14px}
.set .it small{display:block;font-size:11.5px;color:var(--ink3)}
.set .val{color:var(--gold);min-width:44px;text-align:right}
.tog{flex:none;min-width:64px;padding:6px 10px;margin:2px;border-radius:0;border:none;background:linear-gradient(#35413e 0 6px,#2c3634 6px);box-shadow:inset 0 2px 0 #566a67,inset 0 -3px 0 #151c1b,0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge);font-size:13px}
.tog.on{background:linear-gradient(#e6ad48 0 6px,#d4962f 6px);color:#241505;box-shadow:inset 0 2px 0 #ffe49a,inset 0 -3px 0 #8a5416,0 -2px 0 #1a0f04,0 2px 0 #1a0f04,-2px 0 0 #1a0f04,2px 0 0 #1a0f04}
.tog:active{transform:translateY(1px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin-top:2px}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:2px;border:2px solid var(--edge);background:linear-gradient(90deg,var(--amber) var(--v,50%),var(--stone-lo) var(--v,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;border-radius:2px;background:var(--parch);border:2px solid var(--edge);box-shadow:inset 1px 1px 0 var(--parch-hi),inset -1px -2px 0 var(--parch-lo);margin-top:-10px}
.title-art{height:120px;margin:-4px auto 0}
.ver{font-size:11px;color:var(--ink3);margin-top:8px}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:20;background:var(--win);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--amber);color:var(--gold);padding:9px 16px;border-radius:3px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:normal;max-width:calc(100vw - 32px);text-align:center;line-height:1.5}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="row">
      <button id="menuBtn" class="icon-btn" aria-label="メニュー">☰</button>
      <div id="floorName"></div>
      <div id="quota"></div>
    </div>
    <div id="depth"></div>
    <div id="goal" hidden><b id="goalTxt"></b><button id="goalRetry">やり直す</button></div>
    <div class="row"><div class="bar"><i id="hpFill"></i><b id="hpTxt"></b></div><div id="guard"></div></div>
    <div class="row"><div id="lv">Lv1</div><div class="bar exp" id="expBar"><i id="expFill"></i><b id="expTxt"></b></div><div id="atk"></div><div id="gold"></div></div>
  </header>
  <div id="play">
    <div id="stage"><canvas id="cv"></canvas><div id="banner"></div></div>
    <div id="info"></div>
    <div id="cancelZone"><div class="cz"><b>✕</b>ここではなすとキャンセル</div></div>
  </div>
</div>
<div id="tip" hidden></div>
<div id="overlay" hidden></div>
<div id="toast"></div>
<script src="debug-config.js" onerror="this.remove()"></script>
<script src="balance.js"></script>
<script src="rules.js"></script>
<script src="sprites.js"></script>
<script src="app.js"></script>
</body>
</html>
